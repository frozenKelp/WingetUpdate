name: "1 · Update App Metadata"

# ─────────────────────────────────────────────────────────────────────────────
# Fetches a GitHub release for the app configured in apps/<app>/meta.json,
# picks the installer assets matching `assetPatterns`, takes each SHA-256 from
# the asset's `digest` field, and writes/updates:
#   • apps/<app>/<version>.json  – full release metadata
#   • apps/<app>/meta.json       – version index & latestVersion pointer
#
# An existing apps/<app>/<version>.json is never changed unless `force` is
# ticked: if the release now differs (e.g. the installer was re-uploaded) the
# run stops and lists what differs.
#
# Manual only. When metadata changes (or `force` is ticked) it dispatches workflow 2
# (Generate & Validate Manifests) for the same app/version.
# Submitting the PR (workflow 3) stays manual.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      app:
        description: App folder name under apps/, e.g. moku
        required: true
        type: string
      version:
        description: >
          Version to fetch, e.g. 0.9.2 (without the tag prefix).
          Leave empty to use the latest published GitHub release.
        required: false
        type: string
      force:
        description: >
          Overwrite existing data for this version and regenerate its
          manifests (passed on to workflow 2).
        required: false
        type: boolean
        default: false

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to push the updated JSON files
      actions: write         # needed to dispatch the manifest workflow
      issues: write          # report failures

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Fetch release via GitHub CLI ────────────────────────────────────
      - name: Fetch release data
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP: ${{ inputs.app }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          META="apps/$APP/meta.json"
          if [[ ! "$APP" =~ ^[A-Za-z0-9._-]+$ || ! -f "$META" ]]; then
            echo "::error::Unknown app '$APP'. Available: $(ls apps | tr '\n' ' ')"
            exit 1
          fi

          PROJECT_URL=$(jq -r '.projectUrl' "$META")
          TAG_PREFIX=$(jq -r '.tagPrefix // "v"' "$META")
          OWNER_REPO="${PROJECT_URL#https://github.com/}"

          if [[ -n "$INPUT_VERSION" ]]; then
            echo "Fetching release for tag $TAG_PREFIX$INPUT_VERSION"
            RELEASE=$(gh api "repos/$OWNER_REPO/releases/tags/$TAG_PREFIX$INPUT_VERSION")
          else
            echo "Fetching latest release"
            RELEASE=$(gh api "repos/$OWNER_REPO/releases/latest")
          fi

          echo "$RELEASE" > /tmp/release.json
          echo "─── Raw release JSON (trimmed) ───────────────────────────────"
          echo "$RELEASE" | jq '{tag_name, published_at, html_url, assets: [.assets[] | {name, browser_download_url, digest}]}'

          TAG_NAME=$(jq -r '.tag_name' /tmp/release.json)
          VERSION="${TAG_NAME#"$TAG_PREFIX"}"
          PUBLISHED_AT=$(jq -r '.published_at | split("T")[0]' /tmp/release.json)
          HTML_URL=$(jq -r '.html_url' /tmp/release.json)

          # ── one installer per pattern; each must match exactly one asset ─
          echo "[]" > /tmp/installers.json
          while IFS= read -r PATTERN; do
            MATCHES=$(jq -c --arg p "$PATTERN" '[.assets[] | select(.name | test($p))]' /tmp/release.json)
            COUNT=$(echo "$MATCHES" | jq 'length')
            if [[ "$COUNT" -ne 1 ]]; then
              echo "::error::Pattern '$PATTERN' matched $COUNT assets in $TAG_NAME (need exactly 1)"
              exit 1
            fi
            URL=$(echo "$MATCHES"    | jq -r '.[0].browser_download_url')
            DIGEST=$(echo "$MATCHES" | jq -r '.[0].digest // ""')
            if [[ -z "$DIGEST" ]]; then
              echo "::error::Asset $URL has no 'digest' field – cannot determine SHA-256 without downloading."
              exit 1
            fi
            # digest format: "sha256:<hex>"
            SHA256=$(echo "${DIGEST#sha256:}" | tr '[:lower:]' '[:upper:]')
            jq --arg u "$URL" --arg s "$SHA256" '. + [{url: $u, sha256: $s}]' /tmp/installers.json > /tmp/i.json
            mv /tmp/i.json /tmp/installers.json
            echo "✓ Installer : $URL"
            echo "  SHA-256   : $SHA256"
          done < <(jq -r '.assetPatterns[]' "$META")

          if [[ "$(jq 'length' /tmp/installers.json)" -eq 0 ]]; then
            echo "::error::$META has no assetPatterns"
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "tag_name=$TAG_NAME"
            echo "published_at=$PUBLISHED_AT"
            echo "html_url=$HTML_URL"
          } >> "$GITHUB_OUTPUT"

          # Store release-notes body to a file (may contain quotes / newlines)
          jq -r '.body // ""' /tmp/release.json > /tmp/release_notes.txt

          echo ""
          echo "✓ App          : $APP"
          echo "✓ Version      : $VERSION"
          echo "✓ Published    : $PUBLISHED_AT"

      # ── 3. Write / overwrite the version JSON file ─────────────────────────
      - name: Write version JSON  (apps/<app>/<version>.json)
        env:
          FORCE:             ${{ inputs.force }}
          APP:               ${{ inputs.app }}
          VERSION:           ${{ steps.release.outputs.version }}
          TAG_NAME:          ${{ steps.release.outputs.tag_name }}
          PUBLISHED_AT:      ${{ steps.release.outputs.published_at }}
          RELEASE_NOTES_URL: ${{ steps.release.outputs.html_url }}
        run: |
          python3 - << 'EOF'
          import json, os

          app   = os.environ["APP"]
          v     = os.environ["VERSION"]
          notes = open("/tmp/release_notes.txt").read().strip()
          installers = json.load(open("/tmp/installers.json"))

          payload = {
              "version":         v,
              "tagName":         os.environ["TAG_NAME"],
              "publishedAt":     os.environ["PUBLISHED_AT"],
              # First installer kept in the old single-installer fields.
              "installerUrl":    installers[0]["url"],
              "installerSha256": installers[0]["sha256"],
              "installers":      installers,
              "releaseNotesUrl": os.environ["RELEASE_NOTES_URL"],
              "releaseNotes":    notes,
          }

          path = f"apps/{app}/{v}.json"
          if os.path.exists(path):
              with open(path, encoding="utf-8") as f:
                  old = json.load(f)
              diff = sorted(k for k in set(old) | set(payload) if old.get(k) != payload.get(k))
              if not diff:
                  print(f"  {path} unchanged")
              elif os.environ.get("FORCE") != "true":
                  for k in diff:
                      print(f"::error::{path}: {k} differs from the release now "
                            f"(stored {str(old.get(k))[:80]!r}, release {str(payload.get(k))[:80]!r})")
                  print("::error::Existing data NOT overwritten. If this change is expected, re-run with 'force' ticked.")
                  raise SystemExit(1)
              else:
                  print(f"::warning::force: overwriting {path} (changed: {', '.join(diff)})")
          with open(path, "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(f"✓ Wrote {path}")
          EOF

      # ── 4. Update the version index (meta.json) ────────────────────────────
      - name: Update apps/<app>/meta.json
        env:
          APP:     ${{ inputs.app }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 - << 'EOF'
          import json, os

          app = os.environ["APP"]
          v   = os.environ["VERSION"]
          path = f"apps/{app}/meta.json"

          def vtuple(s):
              """Parse a dotted version into a comparable tuple of ints."""
              try:
                  return tuple(int(x) for x in s.split("."))
              except ValueError:
                  return (0, 0, 0)

          with open(path, encoding="utf-8") as f:
              meta = json.load(f)

          # Add new version entry if not already present
          if not any(e["version"] == v for e in meta.get("versions", [])):
              meta.setdefault("versions", []).insert(
                  0, {"version": v, "file": f"apps/{app}/{v}.json"}
              )
              print(f"✓ Added version {v} to versions list")
          else:
              print(f"  Version {v} already in versions list")

          # Advance latestVersion if this release is newer
          current = meta.get("latestVersion") or "0.0.0"
          if vtuple(v) > vtuple(current):
              meta["latestVersion"] = v
              print(f"✓ latestVersion updated: {current} → {v}")
          else:
              print(f"  latestVersion unchanged ({current})")

          with open(path, "w", encoding="utf-8") as f:
              json.dump(meta, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(f"✓ {path} saved")
          EOF

      # ── 5. Commit and push ─────────────────────────────────────────────────
      - name: Commit & push metadata changes
        id: commit
        env:
          APP:     ${{ inputs.app }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "apps/$APP/"
          if git diff --staged --quiet; then
            echo "Nothing changed – metadata is already up to date."
          else
            git commit -m "chore($APP): update metadata to v$VERSION"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✓ Pushed metadata update for $APP v$VERSION"
          fi

      # ── 6. Hand off to workflow 2 ──────────────────────────────────────────
      # A push made with GITHUB_TOKEN doesn't trigger workflows, but
      # workflow_dispatch does.
      - name: Dispatch manifest generation
        if: steps.commit.outputs.changed == 'true' || inputs.force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP:      ${{ inputs.app }}
          VERSION:  ${{ steps.release.outputs.version }}
          FORCE:    ${{ inputs.force }}
          REF:      ${{ github.ref_name }}
        run: |
          gh workflow run GenManifest.yml --ref "$REF" -f app="$APP" -f version="$VERSION" -f force="$FORCE"
          echo "✓ Dispatched Generate & Validate Manifests for $APP v$VERSION"

      # ── On failure: open an issue so you hear about it even when this run
      #    was started by another workflow (GitHub only emails the person who
      #    started a run, and a workflow isn't a person).
      - name: Report failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER:    ${{ github.repository_owner }}
          WHAT:     "1 · Update Metadata"
          APP:      ${{ inputs.app }}
          VERSION:  ${{ inputs.version }}
          RUN_URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s\n\n%s\n' "**$WHAT** failed for \`$APP\` ${VERSION:-latest}." \
            "See the run summary and the red step for details: $RUN_URL" > failure.md
          gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$OWNER" \
            --title "❌ $WHAT failed: $APP ${VERSION:-latest}" --body-file failure.md
